name: BSC Dedicated Logs RPC Tests

on:
  push:
    branches: ["fix/bsc-dedicated-log-rpc"]
  pull_request:
    paths:
      - "bnb_pledge_watcher.py"
      - "pool_deposit_watcher.py"
      - "tests/test_bsc_dedicated_logs_rpc.py"
      - ".github/workflows/bsc-dedicated-log-rpc-tests.yml"

permissions:
  contents: read

jobs:
  bsc-rpc-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run BSC RPC routing regression tests
        run: python -m unittest discover -s tests -p "test_bsc_dedicated_logs_rpc.py" -v
