name: BTC Observer Foundation Tests

on:
  pull_request:
    paths:
      - "services/btc_observer.py"
      - "services/btc_node_agent.py"
      - "services/btc_deposit_outbox.py"
      - "services/btc_provider_revenue.py"
      - "tests/test_btc_observer.py"
      - "tests/test_btc_deposit_outbox.py"
      - "tests/test_btc_node_agent.py"
      - "tests/test_btc_provider_revenue.py"
      - "docs/BTC_OBSERVER_V1.md"
      - "docs/BTC_PROVIDER_REVENUE_OBSERVER.md"
      - "requirements.txt"
      - ".github/workflows/btc-observer-tests.yml"
  push:
    paths:
      - "services/btc_observer.py"
      - "services/btc_node_agent.py"
      - "services/btc_deposit_outbox.py"
      - "services/btc_provider_revenue.py"
      - "tests/test_btc_observer.py"
      - "tests/test_btc_deposit_outbox.py"
      - "tests/test_btc_node_agent.py"
      - "tests/test_btc_provider_revenue.py"
      - "docs/BTC_OBSERVER_V1.md"
      - "docs/BTC_PROVIDER_REVENUE_OBSERVER.md"
      - "requirements.txt"
      - ".github/workflows/btc-observer-tests.yml"

jobs:
  observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install pytest pyzmq
      - name: Compile BTC observer and local node agent
        run: |
          python -m py_compile services/btc_observer.py
          python -m py_compile services/btc_deposit_outbox.py
          python -m py_compile services/btc_node_agent.py
          python -m py_compile services/btc_provider_revenue.py
      - name: Run focused BTC observer tests
        run: python -m pytest -q tests/test_btc_observer.py tests/test_btc_deposit_outbox.py tests/test_btc_node_agent.py tests/test_btc_provider_revenue.py
