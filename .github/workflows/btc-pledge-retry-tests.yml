name: BTC Pledge Retry Regression Tests

on:
  pull_request:
    paths:
      - "btc_pledge_watcher.py"
      - "server.py"
      - "tests/test_btc_pledge_watcher_retry.py"
      - "tests/test_btc_legacy_pledge_gate.py"
      - ".github/workflows/btc-pledge-retry-tests.yml"
  push:
    branches:
      - "fix/btc-pledge-durable-retries"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btc-pledge-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run BTC pledge safety tests
        run: python -m pytest -q tests/test_btc_pledge_watcher_retry.py tests/test_btc_legacy_pledge_gate.py
