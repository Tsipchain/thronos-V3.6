name: BTC Settlement Accounting Boundary Tests

on:
  pull_request:
    branches:
      - main
      - codex/btc-phase3-legacy-credit-gate
    paths:
      - "services/btc_settlement_accounting.py"
      - "services/btc_custody_policy.py"
      - "tests/test_btc_settlement_accounting.py"
      - "tests/test_btc_custody_policy.py"
      - "docs/BTC_PHASE4_SETTLEMENT_READINESS.md"
      - ".github/workflows/btc-settlement-accounting-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btc-settlement-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: >-
          python -m pytest -q
          tests/test_btc_settlement_accounting.py
          tests/test_btc_custody_policy.py
