name: Cross-Chain Wallet Assets Checks

on:
  push:
    branches: ["feat/arbitrum-usdc-asset-logos"]
  pull_request:
    paths:
      - "public/wallet-pwa/app.js"
      - "thronos-wallet-app/src/components/CrossChainAssetIcon.tsx"
      - "thronos-wallet-app/src/screens/HomeScreen.tsx"
      - "thronos-wallet-app/src/services/crossChain.ts"
      - ".github/workflows/cross-chain-wallet-assets.yml"

permissions:
  contents: read

jobs:
  pwa-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse wallet PWA JavaScript
        run: node --check public/wallet-pwa/app.js

  mobile-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: thronos-wallet-app/package-lock.json
      - name: Install mobile wallet dependencies
        working-directory: thronos-wallet-app
        run: npm install --no-audit --no-fund
      - name: Type-check changed wallet files
        working-directory: thronos-wallet-app
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/wallet-tsc.log 2>&1
          tsc_status=$?
          cat /tmp/wallet-tsc.log
          if grep -E 'src/(components/CrossChainAssetIcon|screens/HomeScreen|services/crossChain)\\.tsx?' /tmp/wallet-tsc.log; then
            echo "TypeScript errors found in files changed by this PR."
            exit 1
          fi
          if [ "$tsc_status" -ne 0 ]; then
            echo "::warning::Project-wide TypeScript still reports pre-existing errors outside this PR's changed files."
          fi
          echo "No TypeScript errors reported for CrossChainAssetIcon, HomeScreen, or crossChain balance service."
