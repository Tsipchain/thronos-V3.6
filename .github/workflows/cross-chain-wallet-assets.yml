name: Cross-Chain Wallet Assets Checks

on:
  push:
    branches: ["feat/arbitrum-usdc-asset-logos", "fix/unified-chain-history-dedup", "feat/arbitrum-usdc-pool-watcher"]
  pull_request:
    paths:
      - "server.py"
      - "pool_deposit_watcher.py"
      - "tests/test_arbitrum_usdc_pool_watcher.py"
      - "tests/test_bsc_dedicated_logs_rpc.py"
      - "public/wallet-pwa/app.js"
      - "tests/test_wallet_history_dedup.mjs"
      - "thronos-wallet-app/src/components/CrossChainAssetIcon.tsx"
      - "thronos-wallet-app/src/screens/HomeScreen.tsx"
      - "thronos-wallet-app/src/screens/HistoryScreen.tsx"
      - "thronos-wallet-app/src/services/api.ts"
      - "thronos-wallet-app/src/services/crossChain.ts"
      - ".github/workflows/cross-chain-wallet-assets.yml"

permissions:
  contents: read

jobs:
  pwa-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse wallet PWA JavaScript
        run: node --check public/wallet-pwa/app.js
      - name: Test chain-aware wallet history deduplication
        run: node tests/test_wallet_history_dedup.mjs

  server-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install watcher test dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile server and pool watcher without running services
        run: python -m py_compile server.py pool_deposit_watcher.py
      - name: Test dedicated BSC logs RPC routing
        run: python -m unittest discover -s tests -p "test_bsc_dedicated_logs_rpc.py" -v
      - name: Test Arbitrum native USDC pool watcher
        run: python -m unittest discover -s tests -p "test_arbitrum_usdc_pool_watcher.py" -v

  mobile-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: thronos-wallet-app/package-lock.json
      - name: Install mobile wallet dependencies
        working-directory: thronos-wallet-app
        run: npm install --no-audit --no-fund
      - name: Type-check changed wallet files
        working-directory: thronos-wallet-app
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/wallet-tsc.log 2>&1
          tsc_status=$?
          cat /tmp/wallet-tsc.log
          if grep -E 'src/(components/CrossChainAssetIcon|screens/(HomeScreen|HistoryScreen)|services/(crossChain|api))\.tsx?' /tmp/wallet-tsc.log; then
            echo "TypeScript errors found in files changed by this work."
            exit 1
          fi
          if [ "$tsc_status" -ne 0 ]; then
            echo "::warning::Project-wide TypeScript still reports existing errors outside the changed wallet files."
          fi
          echo "No TypeScript errors reported in the changed wallet components, screens, or services."
