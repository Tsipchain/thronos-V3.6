name: Extension THR Branding Checks

on:
  pull_request:
    paths:
      - "public/extension/popup.html"
      - "public/extension/popup.css"
      - "tests/test_extension_thr_coin_branding.py"
      - ".github/workflows/extension-thr-branding.yml"

permissions:
  contents: read

jobs:
  extension-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check extension branding and existing handlers
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/test_extension_thr_coin_branding.py -q
