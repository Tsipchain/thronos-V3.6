name: Wallet V1 Recovery Gate

on:
  pull_request:
    paths:
      - "templates/base.html"
      - "static/wallet_session.js"
      - "static/wallet_v1_full_payload_contract.js"
      - "public/static/wallet_v1_full_payload_contract.js"
      - "public/wallet-pwa/index.html"
      - "public/wallet-pwa/app.js"
      - "public/wallet-pwa/sw.js"
      - "server.py"
      - "server_ext.py"
      - "thronos-wallet-app/**"
      - "mobile-sdk/**"
      - "wallet_v1_signed_request_verifier.py"
      - "tests/test_wallet_v1_*.py"
      - ".github/workflows/wallet-v1-recovery-gate.yml"
  workflow_dispatch:

jobs:
  wallet-v1-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCHEDULER_ENABLED: "0"
      EDU_DB_PATH: /tmp/thronos-wallet-v1-recovery-ci.db
      WALLET_E2E_NOBLE_MODULE: /tmp/wallet-e2e-js/node_modules/@noble/secp256k1/index.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/wallet-e2e-js @noble/secp256k1@2.2.3
          npm ci --prefix thronos-wallet-app --ignore-scripts
          npm install --prefix mobile-sdk --ignore-scripts
      - name: Typecheck native wallet and run full SDK security/compatibility gate
        env:
          # Schema-only CI value. Release builds must supply the genuine Expo UUID.
          EAS_PROJECT_ID: 00000000-0000-4000-8000-000000000001
          NATIVE_CONFIG_SCHEMA_ONLY: "1"
        run: |
          npm run --prefix thronos-wallet-app native:config:check
          ./thronos-wallet-app/node_modules/.bin/tsc --noEmit -p thronos-wallet-app/tsconfig.json
          node tests/test_wallet_swap_device_approval.mjs
          cd mobile-sdk
          npm test -- --runInBand
      - name: Run Wallet V1 recovery regression and browser acceptance
        run: |
          python -m pytest -q \
            tests/test_btc_pledge_watcher_retry.py \
            tests/test_wallet_v1_activation_check.py \
            tests/test_wallet_v1_bound_signer_acceptance.py \
            tests/test_wallet_v1_centralized_signing.py \
            tests/test_wallet_v1_credential_security.py \
            tests/test_wallet_v1_crypto_hmac_guards.py \
            tests/test_wallet_v1_execution_engine.py \
            tests/test_wallet_v1_frontend_auth_guards.py \
            tests/test_wallet_v1_full_payload_contract.py \
            tests/test_wallet_v1_v2_route_authorization.py \
            tests/test_wallet_v1_legacy_compatibility_vectors.py \
            tests/test_wallet_v1_migration.py \
            tests/test_wallet_v1_pledge_compatibility_routes.py \
            tests/test_wallet_v1_pool_backend_auth.py \
            tests/test_wallet_v1_public_key_normalization.py \
            tests/test_wallet_v1_real_redis_staging.py \
            tests/test_wallet_v1_recovery_browser_e2e.py \
            tests/test_wallet_v1_recovery_kit_restore.py \
            tests/test_wallet_v1_safe_unlock_address_persistence.py \
            tests/test_wallet_v1_signed_request_verifier.py \
            tests/test_wallet_v1_signed_request_server_integration.py \
            tests/test_wallet_v1_signing_session_guards.py \
            tests/test_wallet_v1_state_recovery.py \
            tests/test_wallet_v1_swap_backend_auth.py \
            tests/test_wallet_v1_thr_reconciliation.py \
            tests/test_wallet_v1_unlock_state_sync_guards.py \
            tests/test_wallet_v1_verified_migration_preference.py \
            tests/test_wallet_v1_wallet_recovery_guards.py \
            tests/test_wallet_pwa_installed_lifecycle.py \
            tests/test_wallet_mobile_sdk_legacy_roundtrip.py \
            tests/test_native_wallet_v2_security.py
